name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      verified_tag: ${{ steps.identity.outputs.tag }}
      verified_sha: ${{ github.sha }}
      tarball_name: ${{ steps.package.outputs.name }}
      tarball_sha256: ${{ steps.package.outputs.sha256 }}
      tarball_integrity: ${{ steps.package.outputs.integrity }}
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Verify release identity
        id: identity
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          package_version="$(bun -e 'const value = await Bun.file("package.json").json(); if (value.name !== "@hraness/textmockups" || typeof value.version !== "string") process.exit(1); process.stdout.write(value.version)')"
          if [[ ! "$package_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Package version $package_version is not a stable semantic version"
            exit 1
          fi
          expected_tag="v$package_version"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $expected_tag"
            exit 1
          fi
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          test "$(git rev-parse "$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::Tag $GITHUB_REF_NAME is not reachable from $DEFAULT_BRANCH"
            exit 1
          fi
          newest_stable_tag="$(git tag --list 'v*' | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | LC_ALL=C sort -V | tail -n 1)"
          if [[ "$newest_stable_tag" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not newer than $newest_stable_tag"
            exit 1
          fi
          printf 'tag=%s\n' "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - run: |
          generated_status="$(git status --porcelain --untracked-files=all -- bun.lock)"
          if [[ -n "$generated_status" ]]; then
            printf '%s\n' "$generated_status"
            exit 1
          fi
      - name: Pack and install the exact release tarball
        id: package
        env:
          VERIFIED_TAG: ${{ steps.identity.outputs.tag }}
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/textmockups-release"
          mkdir "$directory"
          tarball="hraness-textmockups-${VERIFIED_TAG#v}.tgz"
          bun pm pack --ignore-scripts --destination "$directory"
          test -f "$directory/$tarball"
          bun scripts/package-smoke.ts "$directory/$tarball"
          (cd "$directory" && sha256sum "$tarball" > SHA256SUMS)
          sha256="$(sha256sum "$directory/$tarball" | cut -d ' ' -f 1)"
          integrity="$(bun -e 'import {createHash} from "node:crypto"; console.log("sha512-" + createHash("sha512").update(await Bun.file(process.argv[1]).bytes()).digest("base64"))' "$directory/$tarball")"
          printf 'name=%s\nsha256=%s\nintegrity=%s\n' "$tarball" "$sha256" "$integrity" >> "$GITHUB_OUTPUT"
      - name: Preserve the checked release bytes
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: textmockups-release-${{ github.sha }}
          path: ${{ runner.temp }}/textmockups-release/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          path: ${{ runner.temp }}/textmockups-release
          merge-multiple: true
      - name: Publish verified GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          VERIFIED_TAG: ${{ needs.verify.outputs.verified_tag }}
          VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
          TARBALL_NAME: ${{ needs.verify.outputs.tarball_name }}
          TARBALL_SHA256: ${{ needs.verify.outputs.tarball_sha256 }}
        run: |
          set -euo pipefail
          if [[ -z "$VERIFIED_TAG" || "$VERIFIED_TAG" != "$GITHUB_REF_NAME" || "$VERIFIED_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::Publish request does not match the verified tag and commit"
            exit 1
          fi
          directory="$RUNNER_TEMP/textmockups-release"
          test "$TARBALL_NAME" = "hraness-textmockups-${VERIFIED_TAG#v}.tgz"
          test "$(sha256sum "$directory/$TARBALL_NAME" | cut -d ' ' -f 1)" = "$TARBALL_SHA256"
          printf '%s  %s\n' "$TARBALL_SHA256" "$TARBALL_NAME" | cmp - "$directory/SHA256SUMS"
          notes="$RUNNER_TEMP/release-notes.txt"
          printf '%s\n' \
            'Textmockups now ships a compiled package from GitHub Releases. The scene format and phone renderer are unchanged.' \
            '' '## Changes' '' \
            '- Install the same checked package in Textmock, TextButler, and other React apps.' \
            '- Verify package checksums and GitHub’s signed release attestation.' \
            '- Optional npm publication mirrors the GitHub package without repacking it.' \
            '' '## Install' '' '```sh' \
            "bun add https://github.com/$GITHUB_REPOSITORY/releases/download/$VERIFIED_TAG/$TARBALL_NAME" \
            '```' '' '## Verify' '' '```sh' \
            "gh release download $VERIFIED_TAG --repo $GITHUB_REPOSITORY --pattern '$TARBALL_NAME' --pattern SHA256SUMS" \
            'shasum -a 256 -c SHA256SUMS' \
            "gh release verify-asset $VERIFIED_TAG $TARBALL_NAME --repo $GITHUB_REPOSITORY" \
            '```' '' "Source commit: $VERIFIED_SHA" "Package SHA-256: $TARBALL_SHA256" > "$notes"
          if ! gh release view "$VERIFIED_TAG" >/dev/null 2>&1; then
            gh release create "$VERIFIED_TAG" "$directory/$TARBALL_NAME" "$directory/SHA256SUMS" \
              --draft --prerelease --verify-tag --target "$VERIFIED_SHA" \
              --title "Textmockups $VERIFIED_TAG" --notes-file "$notes"
          fi
          release_id="$(gh release view "$VERIFIED_TAG" --json databaseId --jq '.databaseId')"
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]]
          release_api="repos/$GITHUB_REPOSITORY/releases/$release_id"
          release_identity="$(gh api "$release_api" \
            --jq '[.tag_name, .target_commitish] | @tsv')"
          test "$release_identity" = "$VERIFIED_TAG"$'\t'"$VERIFIED_SHA"
          test "$(gh api "$release_api" --jq '.body')" = "$(cat "$notes")"
          if [[ "$(gh api "$release_api" --jq '.draft')" = true ]]; then
            test "$(gh api "$release_api" --jq '.prerelease')" = true
            test "$(gh api "$release_api" --jq '.immutable')" = false
            test "$(gh api "$release_api" --jq 'all(.assets[]; .name == "SHA256SUMS" or .name == env.TARBALL_NAME)')" = true
            for asset in "$TARBALL_NAME" SHA256SUMS; do
              expected_digest="sha256:$(sha256sum "$directory/$asset" | cut -d ' ' -f 1)"
              remote_digest="$(gh api "$release_api" \
                --jq "[.assets[] | select(.name == \"$asset\") | .digest] | if length == 0 then \"missing\" elif length == 1 then .[0] else \"ambiguous\" end")"
              if [[ "$remote_digest" = missing ]]; then
                gh release upload "$VERIFIED_TAG" "$directory/$asset"
              else
                test "$remote_digest" = "$expected_digest"
              fi
            done
          else
            test "$(gh api "$release_api" --jq '.immutable')" = true
          fi
          test "$(gh api "$release_api" --jq '.assets | length')" = 2
          checksum_sha256="$(sha256sum "$directory/SHA256SUMS" | cut -d ' ' -f 1)"
          asset_state="$(gh api "$release_api" \
            --jq '.assets | sort_by(.name) | .[] | [.name, .digest] | @tsv')"
          expected_assets="SHA256SUMS"$'\t'"sha256:$checksum_sha256"$'\n'"$TARBALL_NAME"$'\t'"sha256:$TARBALL_SHA256"
          test "$asset_state" = "$expected_assets"
          readback="$RUNNER_TEMP/release-readback"
          mkdir "$readback"
          gh release download "$VERIFIED_TAG" --dir "$readback" --pattern "$TARBALL_NAME" --pattern SHA256SUMS
          cmp "$directory/SHA256SUMS" "$readback/SHA256SUMS"
          cmp "$directory/$TARBALL_NAME" "$readback/$TARBALL_NAME"
          if [[ "$(gh api "$release_api" --jq '.draft')" = true ]]; then
            gh release edit "$VERIFIED_TAG" --draft=false --latest=false
          fi
          locked_state="$(gh release view "$VERIFIED_TAG" \
            --json assets,isDraft,isImmutable,tagName \
            --jq '[.tagName, .isDraft, .isImmutable, (.assets | length)] | @tsv')"
          test "$locked_state" = "$VERIFIED_TAG"$'\tfalse\ttrue\t2'
          attested=false
          for attempt in $(seq 1 6); do
            if gh release verify "$VERIFIED_TAG" \
              && gh release verify-asset "$VERIFIED_TAG" "$readback/$TARBALL_NAME" \
              && gh release verify-asset "$VERIFIED_TAG" "$readback/SHA256SUMS"; then
              attested=true
              break
            fi
            if [[ "$attempt" != 6 ]]; then sleep 10; fi
          done
          test "$attested" = true
          if [[ "$(gh api "$release_api" --jq '.prerelease')" = true ]]; then
            gh release edit "$VERIFIED_TAG" --prerelease=false --latest
          fi
          release_state="$(gh release view "$VERIFIED_TAG" \
            --json assets,isDraft,isImmutable,isPrerelease,tagName \
            --jq '[.tagName, .isDraft, .isPrerelease, .isImmutable, (.assets | length)] | @tsv')"
          test "$release_state" = "$VERIFIED_TAG"$'\tfalse\tfalse\ttrue\t2'
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')" = "$VERIFIED_TAG"
          gh release verify "$VERIFIED_TAG"
          gh release verify-asset "$VERIFIED_TAG" "$readback/$TARBALL_NAME"
          gh release verify-asset "$VERIFIED_TAG" "$readback/SHA256SUMS"

  npm:
    # Publishes the tagged commit to npm through npm trusted publishing: the
    # registry exchanges this job's GitHub OIDC token for a short-lived credential,
    # so no npm token is stored and no one approves the release. CONTRIBUTING.md
    # lists the one-time registry setup the job needs.
    name: Publish to npm
    needs: [verify, publish]
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_NAME: "@hraness/textmockups"
      VERIFIED_TAG: ${{ needs.verify.outputs.verified_tag }}
      TARBALL_NAME: ${{ needs.verify.outputs.tarball_name }}
      TARBALL_SHA256: ${{ needs.verify.outputs.tarball_sha256 }}
      TARBALL_INTEGRITY: ${{ needs.verify.outputs.tarball_integrity }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          path: ${{ runner.temp }}/textmockups-release
          merge-multiple: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"
      - name: Pin npm
        run: |
          set -euo pipefail
          npm install --global npm@11.19.0 --ignore-scripts --registry=https://registry.npmjs.org
          test "$(npm --version)" = "11.19.0"
      - name: Publish the tagged package
        run: |
          set -euo pipefail
          if [[ -z "$VERIFIED_TAG" || "$VERIFIED_TAG" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Publish request does not match the verified tag"
            exit 1
          fi
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          if [[ "$name" != "$EXPECTED_NAME" || "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::package.json names $name@$version, expected $EXPECTED_NAME at $GITHUB_REF_NAME"
            exit 1
          fi
          tarball="$RUNNER_TEMP/textmockups-release/$TARBALL_NAME"
          test "$(sha256sum "$tarball" | cut -d ' ' -f 1)" = "$TARBALL_SHA256"
          integrity="$(node -e 'const fs=require("node:fs"),crypto=require("node:crypto"); console.log("sha512-"+crypto.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64"))' "$tarball")"
          test "$integrity" = "$TARBALL_INTEGRITY"
          probe="$RUNNER_TEMP/npm-view.txt"
          if ! npm view "$name" name --json --registry=https://registry.npmjs.org >/dev/null 2>"$probe"; then
            if grep -q E404 "$probe"; then
              echo "::notice::Optional npm mirror is not configured. Install the immutable GitHub Release package instead. CONTRIBUTING.md lists the one-time npm setup."
              exit 0
            fi
            cat "$probe"
            echo "::error::Could not read $name from npm"
            exit 1
          fi
          if npm view "$name@$version" version --json --registry=https://registry.npmjs.org >/dev/null 2>"$probe"; then
            test "$(npm view "$name@$version" dist.integrity --prefer-online --registry=https://registry.npmjs.org)" = "$TARBALL_INTEGRITY"
          elif grep -q E404 "$probe"; then
            npm publish "$tarball" --access public --provenance --ignore-scripts --registry=https://registry.npmjs.org
          else
            cat "$probe"
            echo "::error::Could not check whether $name@$version is on npm"
            exit 1
          fi
          for _ in $(seq 1 10); do
            predicate="$(npm view "$name@$version" dist.attestations.provenance.predicateType --prefer-online --registry=https://registry.npmjs.org 2>/dev/null || true)"
            integrity="$(npm view "$name@$version" dist.integrity --prefer-online --registry=https://registry.npmjs.org 2>/dev/null || true)"
            if [[ "$predicate" == "https://slsa.dev/provenance/v1" && "$integrity" == "$TARBALL_INTEGRITY" ]]; then
              echo "Published exact GitHub bytes as $name@$version with provenance"
              exit 0
            fi
            sleep 15
          done
          echo "::error::npm does not report the exact package with a provenance attestation"
          exit 1
